<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>鹤与月 · 末世生存测试</title>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
  :root{--p:#ff6b9d;--bg:#fff5f7}
  *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
  body{background:var(--bg);color:#333;padding:16px;max-width:480px;margin:0 auto}
  .brand{text-align:center;margin-bottom:12px}
  .brand-logo{font-size:20px;font-weight:800;color:var(--p);letter-spacing:2px}
  .brand-sub{font-size:12px;color:#999;margin-top:2px}
  .card{background:#fff;border-radius:20px;padding:20px;box-shadow:0 8px 24px rgba(0,0,0,.06);margin-bottom:16px}
  .progress{height:6px;background:#f0f0f0;border-radius:4px;margin:8px 0 16px;overflow:hidden}
  .progress-bar{height:100%;background:linear-gradient(90deg,#ff6b9d,#ffc107);border-radius:4px;transition:.3s}
  .opt{padding:14px;background:#fafafa;border:2px solid #eee;border-radius:12px;margin-bottom:10px;cursor:pointer;font-size:15px;text-align:center;transition:.15s}
  .opt:active,.opt.selected{background:#fff0f5;border-color:var(--p);color:var(--p);font-weight:600}
  .btn{display:block;width:100%;padding:14px;border:none;border-radius:12px;background:linear-gradient(135deg,#ff6b9d,#ff8eab);color:#fff;font-size:16px;font-weight:700;cursor:pointer;margin:8px 0;text-align:center;text-decoration:none}
  .btn.back-btn{background:#f0f0f0;color:#666}
  .nav-link{display:block;text-align:center;color:var(--p);text-decoration:none;margin:8px 0;font-size:14px}
  .disclaimer{text-align:center;font-size:11px;color:#aaa;margin-top:12px}
  .poster{background:#fff;border-radius:24px;padding:24px}
  .poster-brand{text-align:center;font-size:11px;color:#999;margin-bottom:12px;letter-spacing:2px}
  .main-card{background:linear-gradient(135deg,#ff6b9d,#ff3b6b);color:#fff;border-radius:20px;padding:24px;position:relative;margin-bottom:16px}
  .main-card.dark{background:linear-gradient(135deg,#2c3e50,#4a5568)}
  .badge{display:inline-block;padding:4px 10px;border:1px solid rgba(255,255,255,.5);border-radius:20px;font-size:12px;margin-right:6px;margin-bottom:8px}
  .rank{position:absolute;top:20px;right:20px;font-size:13px;opacity:.9}
  .res-emoji{font-size:48px;line-height:1;margin:8px 0}
  .res-name{font-size:32px;font-weight:800;margin:8px 0}
  .res-sub{font-size:14px;opacity:.9;margin-bottom:12px}
  .res-desc{font-size:14px;line-height:1.6;border-top:1px solid rgba(255,255,255,.3);padding-top:12px;margin-top:12px}
  .stats{display:flex;justify-content:space-between;margin-top:16px;background:#fafafa;border-radius:16px;padding:16px}
  .stat-item{text-align:center;flex:1}
  .stat-num{font-size:22px;font-weight:800;color:var(--p)}
  .stat-label{font-size:11px;color:#666;margin-top:2px}
  .radar-box{height:72px;background:#fafafa;border-radius:12px;margin-top:12px;display:flex;align-items:center;justify-content:center;color:#999;font-size:12px;border:1px dashed #ddd}
  .price-tag{background:#ffc107;color:#333;padding:2px 8px;border-radius:8px;font-size:13px;font-weight:bold}
</style>
</head>
<body>
<div id="app"></div>
<script>
const THEME = {
  name:'末世生存', emoji:'🧟', key:'survival',
  questions:[
    {q:'末日你带啥？',options:[{t:'食物水',a:'A'},{t:'武器',a:'B'},{t:'药品',a:'C'},{t:'通讯',a:'D'}]},
    {q:'遇到丧尸？',options:[{t:'躲起来',a:'A'},{t:'正面打',a:'B'},{t:'智取',a:'C'},{t:'跑最快',a:'D'}]},
    {q:'组队你当？',options:[{t:'后勤',a:'A'},{t:'战斗',a:'B'},{t:'军师',a:'C'},{t:'侦察',a:'D'}]},
    {q:'生存第一？',options:[{t:'活下去',a:'A'},{t:'保护人',a:'B'},{t:'自由',a:'C'},{t:'尊严',a:'D'}]},
    {q:'末日居所？',options:[{t:'地下',a:'A'},{t:'堡垒',a:'B'},{t:'森林',a:'C'},{t:'移动',a:'D'}]}
  ],
  results:{
    A:{emoji:'🏠',name:'避难所管家',tag:'稳健生存 · 后勤王',desc:'你务实靠谱，是团队活下去的基石。',rare:'28.5%',rank:'#1',score:'75',labels:['稳健','务实','后勤'],quote:'"只要仓库满，末日也安稳。"'},
    B:{emoji:'⚔️',name:'末日战神',tag:'战斗狂 · 守护者',desc:'你无畏危险，是团队最硬防线。',rare:'15.2%',rank:'#2',score:'95',labels:['勇猛','守护','战斗'],quote:'"枪林弹雨，我挡前面。"'},
    C:{emoji:'🧠',name:'智谋军师',tag:'脑力生存 · 操盘手',desc:'你靠脑子活，每一步都算得清。',rare:'12.8%',rank:'#3',score:'98',labels:['智慧','冷静','布局'],quote:'"暴力解决不了问题，我能。"'},
    D:{emoji:'🏃',name:'流浪独行',tag:'自由敏捷 · 独狼',desc:'你不被束缚，靠速度活到最后。',rare:'10.5%',rank:'#4',score:'88',labels:['敏捷','自由','独行'],quote:'"不扎根，才活得更久。"'}
  }
};

const state = {qIndex:0, answers:[], score:null};

function render(){
  const app = document.getElementById('app');
  if(state.score) app.innerHTML = result();
  else app.innerHTML = quiz();
  bind();
}

function quiz(){
  const q = THEME.questions[state.qIndex];
  let opts = q.options.map(o=>`<div class="opt" data-a="${o.a}">${o.t}</div>`).join('');
  let pct = (state.qIndex/THEME.questions.length)*100;
  return `<div class="brand"><div class="brand-logo">鹤与月</div><div class="brand-sub">${THEME.emoji} ${THEME.name} · ¥0.99</div></div>
  <div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:13px;color:#999">${state.qIndex+1}/${THEME.questions.length}</span><span style="font-size:12px;color:var(--p);font-weight:bold">测试中</span></div><div class="progress"><div class="progress-bar" style="width:${pct}%"></div></div><h3 style="margin:12px 0;font-size:18px">${q.q}</h3>${opts}</div>`;
}

function result(){
  const r = THEME.results[state.score];
  const darkClass = r.dark ? 'dark' : '';
  let badges = r.labels.map(l=>`<span class="badge">${l}</span>`).join('');
  return `<div class="poster" id="posterArea">
    <div class="poster-brand">鹤与月 · ${THEME.name}</div>
    <div class="main-card ${darkClass}">
      <div style="display:flex;justify-content:space-between;align-items:flex-start">
        <div><span class="badge">稀有度 ${r.rare}</span><span class="badge">排位 ${r.rank}</span></div>
        <div class="rank">指数 ${r.score}/100</div>
      </div>
      <div class="res-emoji">${r.emoji}</div>
      <div class="res-name">${r.name}</div>
      <div class="res-sub">${r.tag}</div>
      <div style="margin:12px 0">${badges}</div>
      <div class="res-desc"><i>${r.quote}</i></div>
    </div>
    <div class="stats">
      <div class="stat-item"><div class="stat-num">${r.rare}</div><div class="stat-label">同类占比</div></div>
      <div class="stat-item"><div class="stat-num">${r.rank}</div><div class="stat-label">综合排位</div></div>
      <div class="stat-item"><div class="stat-num">${r.score}</div><div class="stat-label">特质指数</div></div>
    </div>
    <div class="radar-box">▣ 特质雷达图区域</div>
    <button class="btn" onclick="genPoster()">📸 保存海报分享</button>
    <hr style="margin:16px 0;border:none;border-top:1px solid #eee;">
    <div style="text-align:center;font-size:14px;color:#555;margin-bottom:10px;">还想测别的？<br>其他主题也只要 <span class="price-tag">¥0.99</span></div>
    <a class="nav-link" href="index.html">🏠 返回测试合集</a>
    <a class="nav-link" href="https://www.xiaohongshu.com" target="_blank">📌 小红书店铺 @鹤与月</a>
    <div class="disclaimer">娱乐测试，非专业诊断</div>
  </div>`;
}

function bind(){
  document.querySelectorAll('.opt').forEach(o=>o.onclick=()=>{
    document.querySelectorAll('.opt').forEach(x=>x.classList.remove('selected'));
    o.classList.add('selected');
    state.answers.push(o.dataset.a);
    setTimeout(()=>{state.qIndex++;if(state.qIndex>=THEME.questions.length)calc();render();},300);
  });
}
function calc(){
  const c={};state.answers.forEach(a=>c[a]=(c[a]||0)+1);
  state.score=Object.keys(c).sort((a,b)=>c[b]-c[a])[0];
}
function genPoster(){
  html2canvas(document.getElementById('posterArea'),{backgroundColor:'#fff'}).then(canvas=>{
    const l=document.createElement('a');l.download='鹤与月-'+THEME.name+'.png';l.href=canvas.toDataURL();l.click();
  });
}
render();
</script>
</body>
</html>
