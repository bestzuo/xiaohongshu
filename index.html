<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>鹤与月 · 趣味测试合集</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
  body{background:#fff5f7;color:#333;padding:16px;max-width:480px;margin:0 auto}
  .header{text-align:center;margin-bottom:20px;padding-top:12px}
  .logo{font-size:26px;font-weight:800;background:linear-gradient(135deg,#ff6b9d,#ffc107);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:2px}
  .sub{font-size:13px;color:#999;margin-top:6px}
  .price-note{display:inline-block;background:#ff6b9d;color:#fff;padding:3px 12px;border-radius:12px;font-size:13px;font-weight:bold;margin-top:10px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .theme-card{background:#fff;border:2px solid #ffe0ec;border-radius:18px;padding:18px 12px;text-align:center;cursor:pointer;transition:.2s;text-decoration:none;color:#333;box-shadow:0 4px 12px rgba(255,107,157,.08)}
  .theme-card:active{transform:scale(.96)}
  .theme-emoji{font-size:36px;display:block;margin-bottom:8px}
  .theme-name{font-weight:700;font-size:16px}
  .theme-price{display:inline-block;background:#ffc107;color:#333;padding:2px 8px;border-radius:8px;font-size:12px;font-weight:bold;margin-top:6px}
  .footer{text-align:center;margin-top:24px;padding:16px;background:#fff;border-radius:16px}
  .footer-logo{font-size:18px;font-weight:800;color:#ff6b9d;letter-spacing:2px}
  .disclaimer{font-size:11px;color:#aaa;margin-top:12px;text-align:center}
</style>
</head>
<body>
<div class="header">
  <div class="logo">鹤与月</div>
  <div class="sub">趣味人格测试 · 发现另一个你</div>
  <div class="price-note">每个测试 ¥0.99</div>
</div>

<div class="grid">
  <a class="theme-card" href="animal.html"><span class="theme-emoji">🐾</span><div class="theme-name">动物人格</div><span class="theme-price">¥0.99</span></a>
  <a class="theme-card" href="love.html"><span class="theme-emoji">💕</span><div class="theme-name">恋爱人格</div><span class="theme-price">¥0.99</span></a>
  <a class="theme-card" href="dessert.html"><span class="theme-emoji">🍰</span><div class="theme-name">甜品人格</div><span class="theme-price">¥0.99</span></a>
  <a class="theme-card" href="survival.html"><span class="theme-emoji">🧟</span><div class="theme-name">末世生存</div><span class="theme-price">¥0.99</span></a>
  <a class="theme-card" href="emotion.html"><span class="theme-emoji">🌊</span><div class="theme-name">情绪力测评</div><span class="theme-price">¥0.99</span></a>
</div>

<div class="footer">
  <div class="footer-logo">鹤与月</div>
  <div class="sub" style="margin-top:6px">每个测试独立购买，测完即得结果</div>
  <div class="sub">小红书店铺 @鹤与月</div>
</div>

<div class="disclaimer">仅供娱乐参考 · 非专业诊断</div>
</body>
</html>
